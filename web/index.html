<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AI SOC Agents</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Noto+Kufi+Arabic:wght@500;600;700&display=swap">
<style>
/* Layout: two worlds sharing one palette. The project site is a long editorial page over a plotting grid; the platform is a night-shift SOC console with a fixed rail of views, a status bar, and instrument-like panels. One dark look on purpose, as SOC screens are. */
:root {
  --ink-0: #070c16;
  --bg: #0a1220;
  --surface: #0f192b;
  --surface-2: #15223a;
  --line: #1f2f4b;
  --line-strong: #2c4166;
  --fg: #dde6f4;
  --muted: #8797b6;
  --faint: #5f6f90;
  --accent: #46c2f0;
  --accent-ink: #04121d;
  --accent-soft: rgba(70,194,240,.12);
  --amber: #f3a93c; --amber-soft: rgba(243,169,60,.13);
  --crit: #ff5f6d; --crit-soft: rgba(255,95,109,.14);
  --high: #ff9c4a; --high-soft: rgba(255,156,74,.14);
  --med: #f2cf4a;  --med-soft: rgba(242,207,74,.13);
  --low: #3fd69a;  --low-soft: rgba(63,214,154,.13);
  --ok: #3fd69a; --bad: #ff5f6d;
  --violet: #9d8cff; --violet-soft: rgba(157,140,255,.13);
  --grid: rgba(70,194,240,.045);
  --font-display: "Noto Kufi Arabic", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html[lang="ar"] { --font-body: "IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, Tahoma, sans-serif; }
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 32px 32px;
  color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.65;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--ink-0); }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.3; text-wrap: balance; margin: 0; font-weight: 600; }
h2 { font-size: 1.15rem; } h3 { font-size: 1rem; } h4 { font-size: .92rem; }
p { margin: 0; }
a { color: var(--accent); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--font-mono); font-size: .84em; letter-spacing: .01em; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.ltr { direction: ltr; unicode-bidi: isolate; }
.eyebrow { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); font-weight: 500; }
html[lang="ar"] .eyebrow, html[lang="ar"] .section-title, html[lang="ar"] th, html[lang="ar"] .kv dt, html[lang="ar"] .nav-group { font-family: var(--font-body); letter-spacing: 0; text-transform: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ================= PROJECT SITE ================= */
.site-nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(7,12,22,.88); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.site-nav .in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 18px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.site-links { display: flex; gap: 4px; flex: 1; justify-content: center; flex-wrap: wrap; }
.site-links button { border: 0; background: transparent; color: var(--muted); padding: 6px 10px; border-radius: 7px; cursor: pointer; font-size: .9rem; }
.site-links button:hover { color: var(--fg); background: var(--surface); }
.site-wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 48px; align-items: center; padding-block: 64px 56px; }
.hero h1 { font-size: clamp(1.9rem, 3.6vw, 2.9rem); line-height: 1.22; margin-block: 14px 18px; letter-spacing: -.01em; }
html[lang="ar"] .hero h1 { letter-spacing: 0; line-height: 1.45; }
.hero h1 em { font-style: normal; color: var(--amber); }
.hero .lead { color: var(--muted); font-size: 1.05rem; max-width: 56ch; }
.hero .cta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 26px; }
.hero-facts { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--line); }
.hero-facts div { display: grid; gap: 2px; }
.hero-facts b { font-family: var(--font-mono); font-size: 1.25rem; font-weight: 500; color: var(--fg); }
.hero-facts span { font-size: .8rem; color: var(--muted); }
/* the feed: an alert becoming a report */
.feed { border: 1px solid var(--line-strong); border-radius: 14px; background: var(--ink-0); overflow: hidden; box-shadow: 0 30px 80px -40px rgba(70,194,240,.35); }
.feed-bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-size: .72rem; color: var(--faint); }
.feed-bar .d { width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); }
.feed-bar .live { margin-inline-start: auto; color: var(--ok); display: flex; gap: 6px; align-items: center; }
.feed-bar .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); animation: pulse 2.4s ease-out infinite; }
.feed-raw { padding: 14px 16px; font-family: var(--font-mono); font-size: .76rem; line-height: 1.7; color: var(--muted); direction: ltr; text-align: left; border-bottom: 1px dashed var(--line-strong); white-space: pre-wrap; word-break: break-word; }
.feed-raw .hl { color: var(--crit); }
.feed-raw .inj { color: var(--amber); text-decoration: line-through; text-decoration-color: rgba(243,169,60,.6); }
.feed-arrow { display: flex; align-items: center; gap: 10px; padding: 8px 16px; font-size: .75rem; color: var(--accent); font-family: var(--font-mono); background: var(--accent-soft); }
.feed-out { padding: 14px 16px; display: grid; gap: 10px; }
.feed-out .top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.feed-out .gate { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; border: 1px solid rgba(243,169,60,.4); background: var(--amber-soft); border-radius: 10px; padding: 10px 12px; font-size: .86rem; }
.feed-out .gate b { color: var(--amber); font-weight: 600; }
.sec { padding-block: 56px; border-top: 1px solid var(--line); }
.sec-head { display: grid; gap: 8px; margin-bottom: 28px; max-width: 70ch; }
.sec-head h2 { font-size: clamp(1.35rem, 2.4vw, 1.75rem); }
.sec-head p { color: var(--muted); }
.ps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.ps .panel h3 { margin-block: 8px 8px; font-size: 1.1rem; }
.pain { display: grid; gap: 10px; margin-top: 14px; }
.pain div { display: flex; gap: 10px; align-items: baseline; color: var(--muted); font-size: .92rem; }
.pain div::before { content: ""; width: 6px; height: 6px; border-radius: 2px; background: var(--crit); flex: none; transform: translateY(-2px); }
.ps .panel:last-child .pain div::before { background: var(--ok); }
.flowline { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; counter-reset: f; list-style: none; padding: 0; margin: 0; }
.flowline li { counter-increment: f; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; }
.flowline li::before { content: counter(f, decimal-leading-zero); font-family: var(--font-mono); font-size: .78rem; color: var(--accent); }
.flowline li.gate { border-color: rgba(243,169,60,.5); background: linear-gradient(var(--amber-soft), var(--amber-soft)), var(--surface); }
.flowline li.gate::before { color: var(--amber); }
.flowline b { font-weight: 600; }
.flowline span { color: var(--muted); font-size: .9rem; }
.arch { display: grid; gap: 8px; max-width: 760px; margin-inline: auto; }
.layer { border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px 14px; background: var(--surface); display: grid; gap: 2px; text-align: center; }
.layer small { color: var(--muted); font-size: .8rem; }
.layer.gate { border-color: var(--amber); color: var(--amber); background: var(--amber-soft); font-weight: 600; }
.arch .ar { text-align: center; color: var(--faint); font-size: .8rem; line-height: 1; }
.arch .two { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 8px; }
.arch .mini { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 6px; }
.arch .mini span { font-size: .72rem; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; color: var(--muted); }
.agent-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.agent-card { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 16px; display: grid; gap: 8px; align-content: start; }
.agent-card .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.agent-card p { color: var(--muted); font-size: .9rem; }
.agent-card .tools { font-family: var(--font-mono); font-size: .72rem; color: var(--faint); direction: ltr; text-align: start; }
.enforce { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
.enforce > div { border-top: 2px solid var(--amber); padding-top: 12px; display: grid; gap: 4px; }
.enforce p { color: var(--muted); font-size: .9rem; }
.status-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 18px; }
.check { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.check li { display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: baseline; font-size: .92rem; }
.check li::before { content: "✓"; color: var(--ok); font-weight: 700; }
.check.todo li::before { content: "○"; color: var(--faint); }
.site-foot { border-top: 1px solid var(--line); padding-block: 28px 48px; color: var(--muted); font-size: .85rem; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
@media (max-width: 920px) {
  .hero { grid-template-columns: minmax(0,1fr); padding-block: 40px; gap: 32px; }
  .flowline, .agent-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .site-links { display: none; }
  .site-nav .in { justify-content: space-between; }
}
@media (max-width: 600px) {
  .ps, .flowline, .agent-grid, .enforce, .status-grid, .arch .two { grid-template-columns: minmax(0,1fr); }
  .sec { padding-block: 40px; }
}

/* ================= PLATFORM ================= */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; background: var(--ink-0); border-inline-end: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px; padding-block: 18px; padding-inline: 14px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding-inline: 4px; text-decoration: none; color: var(--fg); background: none; border: 0; cursor: pointer; text-align: start; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--accent); display: grid; place-items: center; color: var(--accent); position: relative; flex: none; }
.brand-mark::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; border: 1px dashed rgba(70,194,240,.45); }
.brand-mark svg { width: 15px; height: 15px; position: relative; }
.brand-name { font-family: var(--font-mono); font-weight: 600; font-size: .92rem; letter-spacing: .02em; display: block; }
.brand-sub { font-size: .72rem; color: var(--muted); line-height: 1.4; display: block; }
.nav { display: grid; gap: 14px; }
.nav-group { display: grid; gap: 2px; }
.nav-group > span { font-family: var(--font-mono); font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); padding: 0 10px 4px; }
html[lang="ar"] .nav-group > span { font-family: var(--font-body); letter-spacing: 0; font-size: .74rem; }
.nav-item { border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 500; display: flex; gap: 11px; align-items: center; text-align: start; position: relative; font-size: .9rem; }
.nav-item svg { width: 17px; height: 17px; flex: none; opacity: .85; }
.nav-item .label { flex: 1; }
.nav-item:hover { background: var(--surface); color: var(--fg); }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--fg); }
.nav-item[aria-current="page"]::before { content: ""; position: absolute; inset-inline-start: -14px; top: 7px; bottom: 7px; width: 3px; border-radius: 3px; background: var(--accent); }
.badge { min-width: 21px; height: 19px; padding: 0 6px; border-radius: 6px; background: var(--amber); color: #1d1204; font-size: .7rem; font-weight: 600; display: inline-grid; place-items: center; font-family: var(--font-mono); }
.badge[data-zero="true"] { display: none; }
.rail-foot { margin-top: auto; display: grid; gap: 8px; }
.mode-pill { display: flex; align-items: center; gap: 8px; font-size: .76rem; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); color: var(--muted); background: transparent; cursor: pointer; text-align: start; }
.mode-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); flex: none; }
.mode-pill.live { color: var(--fg); border-color: rgba(63,214,154,.35); }
.mode-pill.live .dot { background: var(--ok); animation: pulse 2.4s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(63,214,154,.55); } 70% { box-shadow: 0 0 0 7px rgba(63,214,154,0); } 100% { box-shadow: 0 0 0 0 rgba(63,214,154,0); } }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; background: rgba(10,18,32,.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; padding-block: 10px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.crumbs { min-width: 0; flex: 1; display: grid; gap: 0; }
.crumb { font-family: var(--font-mono); font-size: .7rem; color: var(--faint); letter-spacing: .05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.page-title { font-family: var(--font-display); font-size: 1.08rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search { position: relative; width: min(280px, 32vw); }
.search input[type="search"] { width: 100%; padding: 7px 12px; padding-inline-start: 32px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--ink-0); font-size: .86rem; }
.search svg { position: absolute; inset-inline-start: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--faint); }
.clock { color: var(--muted); font-family: var(--font-mono); font-size: .78rem; white-space: nowrap; }
.clock b { color: var(--fg); font-weight: 500; }
.lang-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 11px; cursor: pointer; font-weight: 600; color: var(--fg); font-size: .84rem; white-space: nowrap; }
.who { display: flex; align-items: center; gap: 8px; font-size: .8rem; color: var(--muted); white-space: nowrap; }
.who .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--violet-soft); color: var(--violet); font-family: var(--font-mono); font-weight: 600; font-size: .72rem; border: 1px solid rgba(157,140,255,.35); }
.content { padding-block: 22px 72px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); max-width: 1320px; width: 100%; }
.demo-strip { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: .82rem; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: 10px; padding: 8px 12px; margin-bottom: 18px; }
.demo-strip b { color: var(--amber); font-weight: 600; }

@media (max-width: 980px) {
  .who span:last-child, .clock .tz { display: none; }
  .search { width: min(200px, 30vw); }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: sticky; height: auto; z-index: 18; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-inline-end: 0; border-bottom: 1px solid var(--line); overflow: visible; }
  .brand-sub { display: none; }
  .rail-foot { margin: 0; margin-inline-start: auto; display: flex; }
  .mode-pill .txt { display: none; }
  .nav { order: 3; width: 100%; display: flex; overflow-x: auto; scrollbar-width: none; gap: 4px; }
  .nav::-webkit-scrollbar { display: none; }
  .nav-group { display: flex; gap: 4px; }
  .nav-group > span { display: none; }
  .nav-item { white-space: nowrap; padding: 6px 10px; gap: 7px; }
  .nav-item[aria-current="page"]::before { display: none; }
  .topbar { position: static; flex-wrap: wrap; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .crumbs { flex-basis: 100%; }
  .search { flex: 1; width: auto; }
  .who, .clock { display: none; }
  .content { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}

/* ---------- building blocks ---------- */
.view { display: grid; gap: 18px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-width: 0; }
.panel.flush { padding: 0; overflow: hidden; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.panel.flush .panel-head { padding: 14px 18px 0; }
.split { display: grid; gap: 18px; grid-template-columns: minmax(0,1fr); align-items: start; }
@media (min-width: 1100px) { .split { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); } .split.r { grid-template-columns: minmax(0, 8fr) minmax(0, 4fr); } }
.grid-2 { display: grid; gap: 18px; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
.grid-3 { display: grid; gap: 18px; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; }
@media (max-width: 1000px) { .grid-3 { grid-template-columns: minmax(0,1fr) minmax(0,1fr); } }
@media (max-width: 760px) { .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); } }
.stack { display: grid; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line-strong); background: var(--surface-2); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; color: var(--fg); text-decoration: none; font-size: .9rem; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.approve { background: var(--ok); border-color: var(--ok); color: #03140c; font-weight: 600; }
.btn.reject { color: var(--bad); border-color: rgba(255,95,109,.55); background: transparent; }
.btn.reject:hover { background: var(--crit-soft); border-color: var(--bad); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.small { padding: 4px 10px; font-size: .82rem; }
.btn.big { padding: 11px 20px; font-size: 1rem; }
textarea, input[type="url"], input[type="text"], input[type="search"], select { width: 100%; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--ink-0); padding: 9px 12px; color: var(--fg); }
select { padding-block: 7px; cursor: pointer; }
textarea:focus, input:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { min-height: 200px; resize: vertical; font-family: var(--font-mono); font-size: .84rem; line-height: 1.6; }
::placeholder { color: var(--faint); }
label { font-weight: 500; font-size: .85rem; display: block; margin-bottom: 6px; color: var(--muted); }
.field-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line-strong); background: transparent; border-radius: 7px; padding: 3px 10px; font-size: .8rem; cursor: pointer; color: var(--muted); }
.chip:hover { border-color: var(--accent); color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--fg); border-color: var(--accent); }
.section-title { font-size: .72rem; font-weight: 500; color: var(--accent); letter-spacing: .06em; margin-bottom: 6px; font-family: var(--font-mono); text-transform: uppercase; }
ul.clean { margin: 0; padding-inline-start: 1.2em; display: grid; gap: 4px; }
ul.clean li::marker { color: var(--faint); }

/* severity + status */
.sev { display: inline-flex; align-items: center; gap: 7px; padding: 1px 9px 1px 8px; border-radius: 6px; font-size: .76rem; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.sev::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: currentColor; }
.sev-critical { color: var(--crit); background: var(--crit-soft); border-color: rgba(255,95,109,.35); }
.sev-high { color: var(--high); background: var(--high-soft); border-color: rgba(255,156,74,.3); }
.sev-medium { color: var(--med); background: var(--med-soft); border-color: rgba(242,207,74,.28); }
.sev-low { color: var(--low); background: var(--low-soft); border-color: rgba(63,214,154,.28); }
.sev-unknown { color: var(--muted); background: var(--surface-2); }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 600; padding: 1px 8px; border-radius: 5px; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-new { color: var(--accent); background: var(--accent-soft); }
.st-investigating { color: var(--violet); background: var(--violet-soft); }
.st-awaiting, .st-pending { color: var(--amber); background: var(--amber-soft); }
.st-contained, .st-approved { color: var(--ok); background: var(--low-soft); }
.st-closed, .st-closed_fp, .st-advisory { color: var(--muted); background: var(--surface-2); }
.st-rejected { color: var(--bad); background: var(--crit-soft); }
.tag { display: inline-block; font-size: .68rem; padding: 0 6px; border-radius: 5px; background: var(--surface-2); color: var(--muted); font-weight: 500; font-family: var(--font-mono); border: 1px solid var(--line); white-space: nowrap; }
.tag.example { border-style: dashed; }
.tag.live { color: var(--ok); border-color: rgba(63,214,154,.4); }

/* tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .87rem; }
th { text-align: start; font-weight: 500; color: var(--faint); font-size: .7rem; padding: 9px 12px; border-bottom: 1px solid var(--line); font-family: var(--font-mono); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: rgba(70,194,240,.04); }
th button { border: 0; background: none; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; padding: 0; display: inline-flex; gap: 4px; }
td .ttl { display: block; max-width: 46ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td .sub { display: block; font-size: .76rem; color: var(--faint); }
.sev-cell { position: relative; padding-inline-start: 16px; }
.sev-cell::before { content: ""; position: absolute; inset-inline-start: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--line-strong); }
.sev-cell[data-sev="critical"]::before { background: var(--crit); } .sev-cell[data-sev="high"]::before { background: var(--high); } .sev-cell[data-sev="medium"]::before { background: var(--med); } .sev-cell[data-sev="low"]::before { background: var(--low); }

/* tiles + charts */
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1100px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 600px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; min-width: 0; }
.tile .label { font-size: .78rem; color: var(--muted); }
.tile .value { font-family: var(--font-mono); font-size: 1.6rem; font-weight: 500; line-height: 1.2; font-variant-numeric: tabular-nums; }
.tile .sub { font-size: .74rem; color: var(--faint); }
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 1.2fr) 2fr 34px; gap: 10px; align-items: center; font-size: .84rem; }
.bar-row > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 4px; }
.bar-fill.sev-critical { background: var(--crit); } .bar-fill.sev-high { background: var(--high); } .bar-fill.sev-medium { background: var(--med); } .bar-fill.sev-low { background: var(--low); }
.bar-row .n { text-align: end; font-family: var(--font-mono); font-size: .8rem; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--faint); font-family: var(--font-mono); font-size: 10px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .76rem; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

/* incident detail */
.inc-head { display: grid; gap: 12px; }
.inc-head h1 { font-size: 1.3rem; line-height: 1.45; }
.meta-strip { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: .82rem; color: var(--muted); }
.meta-strip b { color: var(--fg); font-weight: 500; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: none; padding: 9px 14px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-weight: 500; font-size: .9rem; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs .count { font-family: var(--font-mono); font-size: .72rem; color: var(--faint); margin-inline-start: 4px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 0; }
.kv > div { background: var(--surface-2); padding: 10px 14px; min-width: 0; }
.kv dt { font-size: .7rem; color: var(--faint); font-family: var(--font-mono); letter-spacing: .04em; }
.kv dd { margin: 3px 0 0; font-weight: 600; overflow-wrap: anywhere; }
.action-list { display: grid; gap: 10px; }
.action { display: grid; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--ink-0); }
.action .top { display: flex; justify-content: space-between; gap: 10px; align-items: start; flex-wrap: wrap; }
.action .top > div { min-width: 0; flex: 1; }
.action dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 0; font-size: .85rem; }
.action dt { color: var(--faint); }
.action dd { margin: 0; overflow-wrap: anywhere; }
.action .kind { font-size: .72rem; color: var(--faint); font-family: var(--font-mono); }
.confirm { display: grid; gap: 8px; border-top: 1px dashed var(--line-strong); padding-top: 10px; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
.timeline li { display: grid; grid-template-columns: 92px 18px minmax(0,1fr); gap: 10px; position: relative; padding-bottom: 16px; }
.timeline li::after { content: ""; position: absolute; inset-inline-start: 109px; top: 16px; bottom: 0; width: 1px; background: var(--line-strong); }
.timeline li:last-child::after { display: none; }
.timeline .t { font-family: var(--font-mono); font-size: .74rem; color: var(--faint); padding-top: 2px; text-align: end; }
.timeline .dot { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--bg); margin-top: 5px; z-index: 1; }
.timeline .dot.agent { border-color: var(--accent); } .timeline .dot.analyst { border-color: var(--violet); background: var(--violet); } .timeline .dot.system { border-color: var(--faint); } .timeline .dot.gate { border-color: var(--amber); background: var(--amber); } .timeline .dot.exec { border-color: var(--ok); background: var(--ok); }
.timeline .who-l { font-size: .72rem; color: var(--faint); font-family: var(--font-mono); }
.entity-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.entity { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--ink-0); display: grid; gap: 3px; min-width: 0; }
.entity .k { font-size: .7rem; color: var(--faint); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .06em; }
.entity .v { font-family: var(--font-mono); font-size: .84rem; overflow-wrap: anywhere; direction: ltr; text-align: start; }
.raw { white-space: pre-wrap; font-family: var(--font-mono); font-size: .8rem; background: var(--ink-0); padding: 12px; border-radius: 8px; overflow-x: auto; border: 1px solid var(--line); overflow-wrap: anywhere; }
pre.code { margin: 0; white-space: pre; font-family: var(--font-mono); font-size: .76rem; background: var(--ink-0); padding: 12px; border-radius: 8px; overflow-x: auto; border: 1px solid var(--line); direction: ltr; text-align: left; color: var(--muted); }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty::before { content: ""; width: 52px; height: 52px; border-radius: 50%; border: 1px dashed var(--line-strong); background: radial-gradient(circle, var(--accent-soft) 0 30%, transparent 31%); }
.progress { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 10px; background: var(--accent-soft); border: 1px solid rgba(70,194,240,.25); }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--accent); border-top-color: transparent; animation: spin .9s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.notice { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-size: .88rem; }
.notice.error { border-color: rgba(255,95,109,.5); background: var(--crit-soft); }
.notice.warn { border-color: rgba(243,169,60,.45); background: var(--amber-soft); }
.notice.ok { border-color: rgba(63,214,154,.45); background: var(--low-soft); }
.approval { display: grid; gap: 12px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); position: relative; overflow: hidden; }
.approval::before { content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: 3px; background: var(--high); }
.approval[data-sev="critical"]::before { background: var(--crit); } .approval[data-sev="medium"]::before { background: var(--med); } .approval[data-sev="low"]::before { background: var(--low); }
.wait { font-family: var(--font-mono); font-size: .76rem; color: var(--amber); }
.agent-row { display: grid; grid-template-columns: 28px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.agent-row:last-child { border-bottom: 0; }
.agent-ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-family: var(--font-mono); font-size: .7rem; font-weight: 600; }
.agent-ic.off { background: var(--surface-2); color: var(--faint); }
.int-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.int { border: 1px solid var(--line); border-radius: 12px; background: var(--ink-0); padding: 14px; display: grid; gap: 6px; align-content: start; }
.int .head { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.int p { font-size: .84rem; color: var(--muted); }
.summary-text { display: grid; gap: 10px; max-width: 80ch; }
.summary-text p { color: var(--fg); }
.toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); inset-inline-end: max(20px, env(safe-area-inset-right, 0px)); background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px 16px; z-index: 50; max-width: min(420px, calc(100vw - 40px)); font-size: .9rem; box-shadow: 0 14px 40px rgba(0,0,0,.4); }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.filters select, .filters input { width: auto; min-width: 140px; padding-block: 5px; font-size: .84rem; }
.filters input { flex: 1; min-width: 160px; }
.filters .count { margin-inline-start: auto; font-size: .8rem; color: var(--faint); font-family: var(--font-mono); }

/* ================= 3D ================= */
.hero-visual { position: relative; min-height: 640px; display: grid; align-content: end; }
.hero-3d { position: absolute; top: -40px; inset-inline-start: -20px; width: calc(100% + 40px); height: 440px; display: block; }
.hero-legend { position: absolute; top: 0; inset-inline-end: 0; display: grid; gap: 4px; font-size: .74rem; color: var(--muted); background: rgba(7,12,22,.6); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; backdrop-filter: blur(4px); }
.hero-legend span { display: flex; gap: 7px; align-items: center; }
.hero-legend i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.hero-visual .feed { position: relative; z-index: 1; width: min(100%, 440px); margin-inline-start: auto; transform: perspective(1400px) rotateY(-9deg) rotateX(5deg); transform-origin: center bottom; box-shadow: 0 40px 80px -30px rgba(0,0,0,.7), 0 30px 80px -40px rgba(70,194,240,.45); transition: transform .5s ease; }
html[dir="rtl"] .hero-visual .feed { transform: perspective(1400px) rotateY(9deg) rotateX(5deg); }
.hero-visual .feed:hover { transform: perspective(1400px) rotateY(0) rotateX(0); }
@media (max-width: 920px) { .hero-visual { min-height: 600px; } }
@media (max-width: 600px) { .hero-visual { min-height: 560px; } .hero-3d { top: -20px; inset-inline-start: 0; width: 100%; height: 340px; } .hero-visual .feed, html[dir="rtl"] .hero-visual .feed { transform: none; } }

.tilt { transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .25s ease, border-color .2s; transform-style: preserve-3d; will-change: transform; position: relative; }
.tilt::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 0%), rgba(70,194,240,.10), transparent 60%); opacity: 0; transition: opacity .25s; }
.tilt:hover::after { opacity: 1; }
.tilt:hover { border-color: var(--line-strong); }

.arch3d { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 36px; align-items: center; }
.iso { height: 520px; display: grid; place-items: center; perspective: 1600px; overflow: hidden; }
.iso-stack { position: relative; width: 220px; height: 220px; transform-style: preserve-3d; transform: rotateX(60deg) rotateZ(-42deg) translateZ(-170px); }
html[dir="rtl"] .iso-stack { transform: rotateX(60deg) rotateZ(42deg) translateZ(-170px); }
.slab { position: absolute; inset: 0; border-radius: 16px; border: 1px solid var(--line-strong); background: linear-gradient(135deg, rgba(21,34,58,.92), rgba(10,18,32,.92)); transform: translateZ(calc(var(--i) * 46px)); transition: transform .35s ease, border-color .25s, box-shadow .25s; display: flex; flex-direction: column; justify-content: flex-end; padding: 14px 16px; gap: 2px; box-shadow: 0 0 0 1px rgba(7,12,22,.6), -10px 10px 0 -4px rgba(7,12,22,.55); }
.slab span { font-family: var(--font-mono); font-size: .7rem; color: var(--accent); }
.slab b { font-family: var(--font-display); font-weight: 600; font-size: .92rem; }
.slab.gate { border-color: var(--amber); background: linear-gradient(135deg, rgba(243,169,60,.28), rgba(10,18,32,.92)); }
.slab.gate span { color: var(--amber); }
.slab.on { transform: translateZ(calc(var(--i) * 46px + 26px)); border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 40px rgba(70,194,240,.25); }
.slab.gate.on { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber), 0 0 40px rgba(243,169,60,.3); }
.arch-legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.arch-legend li { display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 10px; padding: 9px 12px; border-radius: 10px; border: 1px solid transparent; cursor: default; transition: background .2s, border-color .2s; }
.arch-legend li .n { font-family: var(--font-mono); font-size: .76rem; color: var(--accent); padding-top: 3px; }
.arch-legend li b { display: block; font-weight: 600; }
.arch-legend li small { color: var(--muted); font-size: .84rem; }
.arch-legend li.on { background: var(--surface); border-color: var(--line-strong); }
.arch-legend li.gate .n, .arch-legend li.gate b { color: var(--amber); }
.arch-legend li:focus-visible { outline-offset: 0; }
@media (max-width: 860px) { .arch3d { grid-template-columns: minmax(0,1fr); } .iso { height: 400px; } }
@media (max-width: 480px) { .iso { height: 340px; } .iso-stack { width: 190px; height: 190px; } .slab { transform: translateZ(calc(var(--i) * 26px)); padding: 10px 12px; } .slab.on { transform: translateZ(calc(var(--i) * 26px + 16px)); } .slab b { font-size: .8rem; } }

.graph-panel .panel-head { align-items: flex-start; }
.graph-panel .panel-head > div:first-child { max-width: 70ch; display: grid; gap: 4px; }
html[lang="ar"] .wait { font-family: var(--font-body); }
.graph-wrap { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 16px; }
.graph-wrap canvas { width: 100%; height: 380px; display: block; cursor: grab; border-radius: 10px; background: radial-gradient(ellipse at 50% 40%, rgba(70,194,240,.07), transparent 65%), var(--ink-0); border: 1px solid var(--line); touch-action: none; }
.graph-tip { position: absolute; z-index: 3; max-width: 280px; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; font-size: .84rem; display: grid; gap: 4px; pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
.graph-side { display: grid; gap: 10px; align-content: start; }
.ent-row { display: grid; gap: 2px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.ent-row:last-child { border-bottom: 0; }
.ent-row .mono { overflow-wrap: anywhere; text-align: start; }
.link-btn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font: inherit; font-family: var(--font-mono); font-size: .74rem; }
.link-btn:hover { text-decoration: underline; }
@media (max-width: 900px) { .graph-wrap { grid-template-columns: minmax(0,1fr); } .graph-wrap canvas { height: 320px; } }

.hero h1 { font-size: clamp(2.3rem, 4.6vw, 3.6rem); line-height: 1.15; }
html[lang="ar"] .hero h1 { line-height: 1.4; }
.hero h1 em { display: inline-block; }
.pipe-wrap { margin-bottom: 18px; border: 1px solid var(--line); border-radius: 14px; background: radial-gradient(ellipse at 50% 60%, rgba(70,194,240,.06), transparent 70%), var(--ink-0); overflow: hidden; }
.pipe-wrap canvas { width: 100%; height: 300px; display: block; }
.flowline li.on, .flowline li:hover { border-color: var(--accent); }
@media (max-width: 600px) { .pipe-wrap canvas { height: 220px; } }
.carousel { height: 380px; perspective: 1500px; position: relative; display: grid; align-content: start; }
.ring { position: relative; height: 300px; transform-style: preserve-3d; transform: translateZ(-330px) rotateY(var(--a, 0deg)); transition: transform 1s cubic-bezier(.2,.7,.2,1); }
.c-card { position: absolute; top: 20px; left: 50%; width: 300px; margin-left: -150px; min-height: 200px; transform: rotateY(calc(var(--i) * 60deg)) translateZ(330px); backface-visibility: hidden; transition: opacity .6s, filter .6s, box-shadow .6s; background: linear-gradient(160deg, var(--surface-2), var(--surface)); }
.c-card[data-off="0"] { box-shadow: 0 30px 60px -30px rgba(0,0,0,.7), 0 0 0 1px var(--accent), 0 0 50px -10px rgba(70,194,240,.35); }
.c-card[data-off="1"] { opacity: .55; filter: saturate(.6); }
.c-card[data-off="2"], .c-card[data-off="3"] { opacity: .25; }
.c-card .head { justify-content: flex-start; gap: 10px; }
.c-card .head .st { margin-inline-start: auto; }
.car-ctl { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 18px; position: relative; z-index: 2; }
.car-dots { display: flex; gap: 8px; }
.car-dots .dot { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--line-strong); background: transparent; padding: 0; cursor: pointer; }
.car-dots .dot[aria-current="true"] { background: var(--accent); border-color: var(--accent); }
.carousel + .agent-grid { display: none; }
@media (max-width: 760px) { .carousel { display: none; } .carousel + .agent-grid { display: grid; } }
.gate-head { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 18px; align-items: center; }
.gate-head canvas { width: 230px; height: 190px; display: block; }

function demoClassify(text) {
  const rule = RULES.find(r => r.re.test(text));
  const short = text.trim().replace(/\s+/g, ' ');
  const summaryTxt = short.length > 170 ? short.slice(0, 167) + '…' : short;
  const ents = extractEntities(text); const firstTarget = (ents.find(e => e.kind === 'host') || ents.find(e => e.kind === 'user') || ents.find(e => e.kind === 'ip') || {}).value;
  let report, actions = [];
  if (rule) {
    report = { summary: B(summaryTxt, summaryTxt), type: rule.type, mitre: rule.mitre, severity: rule.sev, confidence: rule.conf, reasons: [rule.reason], missing: rule.missing.slice(), controls: rule.ctl.slice() };
    rule.sys.forEach(t => actions.push({ title: t, category: 'system', target: firstTarget || B('From the alert', 'من التنبيه'), justification: rule.reason, impact: B('To be confirmed by the analyst', 'يحدده المحلل'), rollback: B('Reverse the action from the same console', 'التراجع من اللوحة نفسها') }));
    rule.adv.forEach(t => actions.push({ title: t, category: 'advisory' }));
  } else {
    report = { summary: B(summaryTxt, summaryTxt), type: B('Unclassified', 'غير محدد'), mitre: '—', severity: 'medium', confidence: 'low',
      reasons: [B('The description is too short to classify with confidence', 'الوصف قصير جدًا للتصنيف بثقة')],
      missing: [B('What system is affected?', 'ما النظام المتأثر؟'), B('When did it start?', 'متى بدأ؟'), B('What alerted you?', 'ما مصدر الاكتشاف؟')], controls: [] };

    pts.forEach(o => { const d = .45 + .55 * ((o.q.z + 2.4) / 4.8); const rr = 5 * (o.q.s / v.scale); const gg = ctx.createRadialGradient(o.q.x, o.q.y, 0, o.q.x, o.q.y, rr * 3); gg.addColorStop(0, rgba(col(o.s), .5 * d)); gg.addColorStop(1, rgba(col(o.s), 0)); ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(o.q.x, o.q.y, rr * 3, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = rgba(col(o.s), d); ctx.beginPath(); ctx.arc(o.q.x, o.q.y, rr, 0, Math.PI * 2); ctx.fill(); });
    ctx.font = `600 ${Math.round(v.scale * .9)}px "JetBrains Mono", monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = rgba(C.fg, 1); ctx.fillText(String(items.length), c.x, c.y + 1);
  });
  scenes.push(v);
}

/* ================= DASHBOARD ================= */
const dayKey = iso => { try { return new Date(iso).toLocaleDateString('en-CA', { timeZone: 'Asia/Riyadh' }); } catch (e) { return String(iso).slice(0, 10); } };
const COLORS = { critical: 'var(--crit)', high: 'var(--high)', medium: 'var(--med)', low: 'var(--low)', unknown: 'var(--faint)' };
function volumeChart(incs, days) {
  const keys = []; for (let d = days - 1; d >= 0; d--) keys.push(dayKey(new Date(Date.now() - d * 864e5).toISOString()));
  const data = keys.map(k => { const o = { k }; [...SEVS, 'unknown'].forEach(s => o[s] = 0); incs.forEach(i => { if (dayKey(i.createdAt) === k) o[SEVS.includes(i.report.severity) ? i.report.severity : 'unknown']++; }); o.total = SEVS.reduce((t, s) => t + o[s], 0) + o.unknown; return o; });
  const max = Math.max(4, ...data.map(d => d.total)); const top = Math.ceil(max / 2) * 2;
  const W = 720, H = 190, pl = 28, pr = 8, pt = 10, pb = 24, cw = (W - pl - pr) / days, bw = Math.min(26, cw * .62);
  const y = v => pt + (H - pt - pb) * (1 - v / top);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(X('Incidents per day by severity', 'الحوادث يوميًا حسب الخطورة'))}">`;
  [0, top / 2, top].forEach(v => { s += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="${v ? '3 4' : ''}"/><text x="${pl - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`; });
  data.forEach((d, i) => {
    const x = pl + i * cw + (cw - bw) / 2; let acc = 0;
    ['low', 'medium', 'high', 'critical', 'unknown'].forEach(sv => { if (!d[sv]) return; const y1 = y(acc + d[sv]), y0 = y(acc); s += `<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(1, y0 - y1 - 1)}" rx="2" fill="${COLORS[sv]}"><title>${d.k}: ${d[sv]} ${sevName(sv)}</title></rect>`; acc += d[sv]; });
    if (i % 2 === (days - 1) % 2) s += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${d.k.slice(8)}/${d.k.slice(5, 7)}</text>`;
  });
  return s + '</svg>';
}
function meanTriage(incs) { const v = incs.map(i => i.triageSec).filter(x => x > 0); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0; }
function vDashboard() {
  const incs = state.incidents, open = incs.filter(isOpen);
  const critHigh = open.filter(i => sevRank(i.report.severity) >= 3).length;
  const pend = incs.reduce((s, i) => s + pendingOf(i).length, 0);
  const closed = incs.filter(i => !isOpen(i)), fp = incs.filter(i => statusOf(i) === 'closed_fp').length;
  const mtt = meanTriage(incs);
  const queue = []; incs.forEach(inc => pendingOf(inc).forEach(a => queue.push({ inc, a })));
  queue.sort((x, y) => sevRank(y.inc.report.severity) - sevRank(x.inc.report.severity) || String(x.inc.createdAt).localeCompare(String(y.inc.createdAt)));
  const detCount = {}; incs.forEach(i => { const k = i.detector || 'console'; detCount[k] = (detCount[k] || 0) + 1; });
  const dets = Object.entries(detCount).sort((a, b) => b[1] - a[1]).slice(0, 6); const maxD = Math.max(1, ...dets.map(d => d[1]));
  const openSev = SEVS.map(s => [s, open.filter(i => i.report.severity === s).length]); const maxS = Math.max(1, ...openSev.map(x => x[1]));
  return `

    <div class="tile tilt"><span class="label">${esc(X('Critical or high, open', 'حرجة أو عالية مفتوحة'))}</span><span class="value" style="color:var(--crit)">${critHigh}</span><span class="sub">${esc(X('need priority attention', 'تتطلب أولوية'))}</span></div>
    <div class="tile tilt"><span class="label">${esc(X('Awaiting approval', 'بانتظار الموافقة'))}</span><span class="value" style="color:var(--amber)">${pend}</span><span class="sub">${esc(X('actions held at the gateway', 'إجراءات معلّقة عند البوابة'))}</span></div>
    <div class="tile tilt"><span class="label">${esc(X('Mean time to triage', 'متوسط وقت الفرز'))}</span><span class="value">${mtt ? esc(fmtDur(mtt)) : '—'}</span><span class="sub">${esc(X('alert received → report ready', 'من استقبال التنبيه حتى جاهزية التقرير'))}</span></div>
    <div class="tile tilt"><span class="label">${esc(X('False-positive rate', 'نسبة الإنذارات الكاذبة'))}</span><span class="value">${closed.length ? Math.round(fp / closed.length * 100) + '%' : '—'}</span><span class="sub">${esc(X(`${fp} of ${closed.length} closed incidents`, `${fp} من ${closed.length} حوادث مغلقة`))}</span></div>
  </div>
  <div class="split r">
    <div class="panel"><div class="panel-head"><h2>${esc(X('Incidents per day, last 14 days', 'الحوادث يوميًا، آخر 14 يومًا'))}</h2><div class="legend">${SEVS.map(s => `<span><i style="background:${COLORS[s]}"></i>${esc(sevName(s))}</span>`).join('')}</div></div><div class="chart ltr">${volumeChart(incs, 14)}</div></div>
    <div class="panel"><div class="panel-head"><h2>${esc(X('Open by severity', 'المفتوحة حسب الخطورة'))}</h2></div><div class="bars">${openSev.map(([s, n]) => `<div class="bar-row"><span>${sevPill(s)}</span><div class="bar-track"><div class="bar-fill sev-${s}" style="width:${n / maxS * 100}%"></div></div><span class="n">${n}</span></div>`).join('')}</div>
      <div class="panel-head" style="margin-top:22px"><h2>${esc(X('Alert sources', 'مصادر التنبيهات'))}</h2></div><div class="bars">${dets.map(([k, n]) => `<div class="bar-row"><span title="${esc(L(DET[k] || DET.console))}">${esc(L(DET[k] || DET.console))}</span><div class="bar-track"><div class="bar-fill" style="width:${n / maxD * 100}%"></div></div><span class="n">${n}</span></div>`).join('')}</div></div>
  </div>
  <div class="panel graph-panel">

function incTable(list, compact) {
  if (!list.length) return `<div class="empty"><p>${esc(X('No incidents match these filters.', 'لا توجد حوادث تطابق هذه الفلاتر.'))}</p></div>`;
  return `<div class="table-wrap"><table><thead><tr><th>${esc(X('Incident', 'الحادثة'))}</th><th>${esc(X('Severity', 'الخطورة'))}</th><th>${esc(X('Status', 'الحالة'))}</th>${compact ? '' : `<th>${esc(X('Type', 'النوع'))}</th><th>${esc(X('Source', 'المصدر'))}</th>`}<th>${esc(X('Created', 'الإنشاء'))}</th></tr></thead><tbody>
  ${list.map(i => `<tr class="clickable" data-go="${esc(i.id)}" tabindex="0"><td class="sev-cell" data-sev="${esc(i.report.severity)}"><span class="ttl" ${D(titleOf(i))}>${esc(titleOf(i))}</span><span class="sub"><span class="mono">${esc(i.id)}</span> ${i.example ? exTag() : (i.source === 'live' ? liveTag() : '')}</span></td><td>${sevPill(i.report.severity)}</td><td>${stPill(statusOf(i))}</td>${compact ? '' : `<td dir="auto" style="min-width:150px">${esc(L(i.report.type))}</td><td style="white-space:nowrap">${esc(L(DET[i.detector] || DET.console))}</td>`}<td class="tnum" style="white-space:nowrap">${esc(fmtTime(i.createdAt))}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function filteredIncidents() {
  const q = ui.q.trim().toLowerCase();
  let list = state.incidents.filter(i => {
    if (ui.sevF.length && !ui.sevF.includes(i.report.severity)) return false;
    const st = statusOf(i);
    if (ui.stF === 'open' && !isOpen(i)) return false;
    if (ui.stF !== 'all' && ui.stF !== 'open' && st !== ui.stF) return false;
    if (ui.detF !== 'all' && (i.detector || 'console') !== ui.detF) return false;
    if (q) { const hay = [i.id, i.input, L(i.report.summary), L(i.report.type), L(i.report.mitre), entitiesOf(i).map(e => e.value).join(' ')].join(' ').toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  });
  if (ui.sort === 'sev') list.sort((a, b) => sevRank(b.report.severity) - sevRank(a.report.severity) || String(b.createdAt).localeCompare(String(a.createdAt)));
  else list.sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  return list;
}
function vIncidents() {
  const list = filteredIncidents();

      <select id="stF" aria-label="${esc(X('Status', 'الحالة'))}"><option value="all">${esc(X('All statuses', 'كل الحالات'))}</option><option value="open" ${ui.stF === 'open' ? 'selected' : ''}>${esc(X('Open only', 'المفتوحة فقط'))}</option>${Object.keys(STATUS).map(k => `<option value="${k}" ${ui.stF === k ? 'selected' : ''}>${esc(L(STATUS[k]))}</option>`).join('')}</select>
      <select id="detF" aria-label="${esc(X('Source', 'المصدر'))}"><option value="all">${esc(X('All sources', 'كل المصادر'))}</option>${dets.map(d => `<option value="${d}" ${ui.detF === d ? 'selected' : ''}>${esc(L(DET[d] || DET.console))}</option>`).join('')}</select>
      <select id="sortF" aria-label="${esc(X('Sort', 'الترتيب'))}"><option value="time">${esc(X('Newest first', 'الأحدث أولًا'))}</option><option value="sev" ${ui.sort === 'sev' ? 'selected' : ''}>${esc(X('Highest severity first', 'الأخطر أولًا'))}</option></select>

async function decide(key, decision, note) {
  const [incId, actId] = key.split('|');
  const inc = findInc(incId); if (!inc) return;
  const a = inc.actions.find(x => x.id === actId); if (!a || a.status !== 'pending') return;
  a.status = decision; a.decidedAt = new Date().toISOString(); if (note) a.note = note;
  if (decision === 'rejected') {
    const tgt = a.target ? (typeof a.target === 'object' ? a.target : B(a.target, a.target)) : (typeof a.title === 'object' ? a.title : B(a.title, a.title));
    inc.actions.push({ id: 'a' + (inc.actions.length + 1), title: B('Lower-impact alternative: enhanced monitoring of ' + (tgt.en || tgt.ar), 'بديل أقل تأثيرًا: مراقبة مكثفة لـ ' + (tgt.ar || tgt.en)), category: 'advisory', status: 'advisory' });
  }
  if (!pendingOf(inc).length && inc.status === 'awaiting') inc.status = '';
  ui.confirming = null;
  if (state.decisionUrl) {
    a.sent = true; persist(); render();
    try {
      const res = await fetch(state.decisionUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ incident_id: inc.id, action: L(a.title), target: L(a.target) || '', decision, analyst_note: note || '', decided_at: a.decidedAt, severity: inc.report.severity }) });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      toast(decision === 'approved' ? X('Approved. Sent to n8n for execution.', 'تمت الموافقة وأُرسلت إلى n8n للتنفيذ.') : X('Rejected and logged. A lower-impact alternative was added.', 'سُجّل الرفض، وأُضيف بديل أقل تأثيرًا.'));
    } catch (e) { a.sent = false; persist(); render(); toast(X('Decision logged here, but n8n could not be reached.', 'سُجّل القرار هنا، لكن تعذّر الوصول إلى n8n.')); }
  } else {
    a.sent = false; persist(); render();
    toast(decision === 'approved' ? X('Approved and logged. No decision webhook is set, so nothing was executed.', 'سُجّلت الموافقة، ولم يُنفَّذ شيء لعدم ضبط رابط القرارات.') : X('Rejected and logged. A lower-impact alternative was added.', 'سُجّل الرفض، وأُضيف بديل أقل تأثيرًا.'));
  }
}

  return `<div class="panel"><span class="eyebrow">${esc(X('Agent roster', 'قائمة الوكلاء'))}</span><h2 style="margin-block:4px 6px">${esc(X('One agent in production, five in design', 'وكيل واحد قيد التشغيل، وخمسة في مرحلة التصميم'))}</h2><p class="muted" style="max-width:74ch">${esc(X('The triage agent runs in n8n on Claude Sonnet 5 with a triage skill. The other agents follow the same rules and are the next step of the project.', 'يعمل وكيل الفرز في n8n على Claude Sonnet 5 مع مهارة فرز مخصصة، ويلتزم بقية الوكلاء بالقواعد نفسها عند تنفيذهم في المرحلة التالية.'))}</p></div>
  <div class="grid-3">${AGENTS.map(a => {
    const runs = state.incidents.map(i => runsOf(i).find(r => r.key === a.key)).filter(Boolean);
    const avg = runs.length ? runs.reduce((t, r) => t + r.sec, 0) / runs.length : 0;
    return `<div class="panel stack" style="gap:10px"><div class="row" style="justify-content:space-between"><span class="row" style="gap:10px"><span class="agent-ic ${a.live ? '' : 'off'}">${a.code}</span><h3>${esc(L(a.name))}</h3></span>${a.live ? `<span class="st st-contained">${esc(isLive() ? X('Live', 'مباشر') : X('Ready', 'جاهز'))}</span>` : `<span class="st">${esc(X('Planned', 'مخطط'))}</span>`}</div>
      <p class="muted" style="font-size:.9rem">${esc(L(a.role))}</p>
      <dl class="kv"><div><dt>${esc(X('Runs', 'التشغيلات'))}</dt><dd class="tnum">${runs.length}${a.key === 'triage' ? ` <span class="faint" style="font-weight:400;font-size:.78rem">(${live.length} ${esc(X('live', 'مباشر'))})</span>` : ''}</dd></div><div><dt>${esc(X('Avg. time', 'متوسط الوقت'))}</dt><dd>${avg ? esc(fmtDur(avg)) : '—'}</dd></div></dl>
      <div class="mono faint ltr" style="font-size:.72rem;text-align:start">${esc(a.tools)}</div></div>`; }).join('')}</div>
  <div class="panel"><h2 style="margin-bottom:12px">${esc(X('Guardrails every agent follows', 'ضوابط يلتزم بها كل وكيل'))}</h2><div class="grid-3">${[[B('Read-only tools', 'أدوات قراءة فقط'), B('No agent holds a tool that changes a system.', 'لا يملك أي وكيل أداة قادرة على تغيير نظام.')], [B('Instructions in data are data', 'الأوامر داخل البيانات تُعامَل كبيانات'), B('Commands found inside alerts or logs are ignored and flagged as suspicious.', 'الأوامر داخل التنبيهات أو السجلات تُتجاهل وتُعلَّم كمشبوهة.')], [B('No invented facts', 'لا معلومات مختلَقة'), B('Indicators and controls must come from the input, a tool, or the knowledge base.', 'يجب أن يكون مصدر كل مؤشر أو ضابط هو المدخل أو أداة أو قاعدة المعرفة.')]].map(g => `<div><h3 style="margin-bottom:4px">${esc(L(g[0]))}</h3><p class="muted" style="font-size:.88rem">${esc(L(g[1]))}</p></div>`).join('')}</div></div>`;
}

/* ================= KNOWLEDGE ================= */
function vKnowledge() {
  const loaded = KB.filter(k => k.st === 'loaded').length;
  return `<div class="split r">
    <div class="panel flush"><div class="panel-head"><div><h2>${esc(X('Documents', 'المستندات'))}</h2><p class="muted" style="font-size:.85rem">${esc(X(`${loaded} of ${KB.length} loaded into the triage agent`, `${loaded} من ${KB.length} محمّلة في وكيل الفرز`))}</p></div></div>
      <div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>${esc(X('Reference', 'المرجع'))}</th><th>${esc(X('Document', 'المستند'))}</th><th>${esc(X('Kind', 'النوع'))}</th><th>${esc(X('Status', 'الحالة'))}</th></tr></thead><tbody>
      ${KB.map(k => `<tr><td class="mono" style="white-space:nowrap">${esc(k.id)}</td><td>${esc(L(k.name))}</td><td>${esc(L(k.kind))}</td><td>${k.st === 'loaded' ? `<span class="st st-contained">${esc(X('Loaded', 'محمّل'))}</span>` : `<span class="st st-awaiting">${esc(X('To add', 'للإضافة'))}</span>`}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="faint" style="font-size:.8rem;padding:12px 18px">${esc(X('Arabic PDFs whose text could not be extracted were replaced with cleaned text versions before loading.', 'استُبدلت ملفات PDF العربية التي تعذّر استخراج نصها بنسخ نصية منقّحة قبل تحميلها.'))}</p></div>
    <div class="panel"><h2 style="margin-bottom:12px">${esc(X('Tools', 'الأدوات'))}</h2>${TOOLS.map(t => `<div class="agent-row" style="grid-template-columns:minmax(0,1fr) auto"><div><div style="font-weight:500">${esc(t.name)}</div><div class="faint" style="font-size:.8rem">${esc(L(t.how))}</div></div>${t.st === 'active' ? `<span class="st st-contained">${esc(X('Active', 'مفعّل'))}</span>` : `<span class="st">${esc(X('Planned', 'مخطط'))}</span>`}</div>`).join('')}</div>
  </div>
  <div class="panel flush"><div class="panel-head"><h2>${esc(X('Controls cited by incident type', 'الضوابط المستشهد بها حسب نوع الحادثة'))}</h2></div><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>${esc(X('Situation', 'الحالة'))}</th><th>${esc(X('Control', 'الضابط'))}</th><th>${esc(X('Requirement', 'المتطلب'))}</th><th>${esc(X('Incidents citing it', 'الحوادث المستشهدة'))}</th></tr></thead><tbody>
    ${CONTROL_MAP.map(c => { const ref = c[1].split(' ').slice(0, 2).join(' '); const hits = state.incidents.filter(i => (i.report.controls || []).some(x => (L(x) || '').includes(ref.replace(' Art.', '')) || (L(x) || '').includes(c[1]))); return `<tr><td>${esc(L(c[0]))}</td><td class="mono" style="white-space:nowrap">${esc(c[1])}</td><td>${esc(L(c[2]))}</td><td class="tnum">${hits.length}</td></tr>`; }).join('')}
  </tbody></table></div></div>`;
}

Content-Type: application/json

{
  "alert": "File server FS01: files renamed to .crypt ...",
  "language": "ar",
  "source": "defender",
  "submitted_at": "2026-10-24T09:12:00Z"
}`;
const RES = `{
  "incident_summary": "string",
  "incident_type": "string",
  "mitre": "string",
  "severity": "low | medium | high | critical",
  "confidence": "low | medium | high",
  "reasons": ["string"],
  "missing_info": ["string"],
  "actions": [
    {
      "title": "Isolate FS01 from the network",
      "category": "system | advisory",
      "target": "FS01",
      "justification": "string",
      "impact": "string",
      "rollback": "string"
    }
  ],
  "controls": ["ECC 2-13"]
}`;
const DEC = `POST  /webhook/soc-decision

{
  "incident_id": "INC-1045",
  "action": "Isolate FS01 from the network",
  "target": "FS01",
  "decision": "approved | rejected",
  "analyst_note": "string",
  "decided_at": "2026-10-24T09:15:00Z",
  "severity": "critical"
}`;
function vIntegrations() {
  const ints = [
    ['n8n · SOC Triage', B('Receives alerts and returns the triage report from the agent.', 'يستقبل التنبيهات ويعيد تقرير الفرز من الوكيل.'), state.triageUrl ? 'on' : 'off'],
    ['n8n · SOC Decisions', B('Receives analyst decisions and logs them; executes approved actions as a safe simulation.', 'يستقبل قرارات المحلل ويسجلها، وينفّذ الموافق عليها كمحاكاة آمنة.'), state.decisionUrl ? 'on' : 'off'],
    ['Google Sheets', B('"SOC Audit Log" sheet, written by the decisions workflow.', 'جدول SOC Audit Log يكتب فيه مسار القرارات.'), state.decisionUrl ? 'on' : 'off'],
    ['VirusTotal', B('URL reputation through the "VT URL Lookup" workflow.', 'سمعة الروابط عبر مسار VT URL Lookup.'), 'n8n'],
    ['Telegram', B('Notification of simulated execution after approval.', 'إشعار بالتنفيذ المحاكى بعد الموافقة.'), 'plan'],
    ['Wazuh SIEM', B('Direct alert intake instead of pasting alerts.', 'استقبال التنبيهات مباشرة بدل لصقها يدويًا.'), 'plan']
  ];
  const pill = s => s === 'on' ? `<span class="st st-contained">${esc(X('Connected', 'متصل'))}</span>` : s === 'off' ? `<span class="st st-awaiting">${esc(X('Not set', 'غير مضبوط'))}</span>` : s === 'n8n' ? `<span class="st st-new">${esc(X('Inside n8n', 'داخل n8n'))}</span>` : `<span class="st">${esc(X('Planned', 'مخطط'))}</span>`;
  const steps = [B('Add a Webhook node (POST, path soc-triage). Under Options set Allowed Origins (CORS) to * and Respond to "Using Respond to Webhook node".', 'أضف عقدة Webhook (POST، المسار soc-triage). من Options اجعل Allowed Origins (CORS) = * و Respond = Using Respond to Webhook node.'), B('Connect it to the triage agent. Give it the input {{ $json.body.alert }}.', 'اربطها بوكيل الفرز، واجعل المدخل {{ $json.body.alert }}.'), B('Require the output format shown here (Structured Output Parser).', 'فعّل صيغة المخرجات الموضحة هنا (Structured Output Parser).'), B('End with Respond to Webhook returning the agent output as JSON.', 'اختم بعقدة Respond to Webhook تعيد مخرجات الوكيل كـ JSON.'), B('Second workflow: Webhook (POST, soc-decision) → Google Sheets append → optional simulated execution.', 'المسار الثاني: Webhook (POST، soc-decision) ← إضافة صف في Google Sheets ← تنفيذ محاكى اختياري.'), B('Publish both workflows and paste their production URLs above.', 'انشر المسارين، ثم الصق رابطَي Production في الأعلى.')];
  return `<div class="split">
    <div class="panel stack">
      <div><span class="eyebrow">${esc(X('Live connection', 'الربط المباشر'))}</span><h2 style="margin-top:4px">${esc(X('Connect the n8n workflows', 'ربط مسارات n8n'))}</h2></div>
      <p class="muted">${esc(X('Paste the production URLs of the two webhooks. They are saved in this browser only.', 'الصق رابطَي Production للمسارين، وسيُحفظان في هذا المتصفح فقط.'))}</p>
      <div><label for="triageUrl">${esc(X('Triage webhook URL (POST)', 'رابط الفرز (POST)'))}</label><input type="url" id="triageUrl" dir="ltr" placeholder="https://your-n8n.app.n8n.cloud/webhook/soc-triage" value="${esc(state.triageUrl)}"></div>
      <div><label for="decisionUrl">${esc(X('Decision webhook URL (POST)', 'رابط القرارات (POST)'))}</label><input type="url" id="decisionUrl" dir="ltr" placeholder="https://your-n8n.app.n8n.cloud/webhook/soc-decision" value="${esc(state.decisionUrl)}"></div>
      <div class="row"><button class="btn primary" type="button" data-act="saveConn">${esc(X('Save', 'حفظ'))}</button><button class="btn" type="button" data-act="testConn">${esc(X('Test connection', 'اختبار الاتصال'))}</button>${state.triageUrl || state.decisionUrl ? `<button class="btn ghost" type="button" data-act="clearConn">${esc(X('Disconnect', 'قطع الاتصال'))}</button>` : ''}</div>
      <div id="connStatus"></div>
      <div class="notice">${esc(X('The platform is the approval gateway: the agent only proposes actions, and only the decision webhook can execute one. Inside Claude outbound calls are blocked, so use the downloaded HTML file for live mode.', 'المنصة هي بوابة الموافقة: يقترح الوكيل فقط، ولا يُنفَّذ إجراء إلا عبر رابط القرارات. الاتصالات الخارجية محظورة داخل Claude، لذا استخدم ملف HTML المحفوظ للوضع المباشر.'))}</div>
      <div><h3 style="margin-bottom:8px">${esc(X('Setting it up in n8n', 'الإعداد في n8n'))}</h3><ol class="clean" style="padding-inline-start:1.4em">${steps.map(s => `<li style="font-size:.88rem">${esc(L(s))}</li>`).join('')}</ol></div>
    </div>
    <div class="stack">
      <div class="panel"><h2 style="margin-bottom:12px">${esc(X('Connected services', 'الخدمات المتصلة'))}</h2><div class="int-grid">${ints.map(i => `<div class="int"><div class="head"><b style="font-size:.9rem">${esc(i[0])}</b>${pill(i[2])}</div><p>${esc(L(i[1]))}</p></div>`).join('')}</div></div>
      <div class="panel stack"><h2>${esc(X('What n8n receives and returns', 'ما يستقبله n8n وما يعيده'))}</h2>
        ${[[X('Triage request', 'طلب الفرز'), REQ, 'req'], [X('Expected triage response', 'رد الفرز المتوقع'), RES, 'res'], [X('Decision request', 'طلب القرار'), DEC, 'dec']].map(([t, c, id]) => `<div class="stack" style="gap:6px"><div class="row" style="justify-content:space-between"><h3>${esc(t)}</h3><button class="btn small" type="button" data-copy="${id}">${esc(X('Copy', 'نسخ'))}</button></div><pre class="code" id="code-${id}">${esc(c)}</pre></div>`).join('')}
      </div>
    </div>
  </div>`;
}
async function testConnection() {
  const st = $('#connStatus'); const url = ($('#triageUrl').value || '').trim();
  if (!url) { st.innerHTML = `<div class="notice error">${esc(X('Paste the triage webhook URL first.', 'الصق رابط الفرز أولًا.'))}</div>`; return; }
  st.innerHTML = `<div class="progress"><span class="spinner"></span><span>${esc(X('Calling n8n…', 'جاري الاتصال بـ n8n…'))}</span></div>`;
  try {
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ alert: 'Connection test from the AI SOC Agents platform. No incident. Reply with a low-severity classification.', language: state.lang, test: true }) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    state.triageUrl = url; persist(); chrome();
    st.innerHTML = `<div class="notice ok">${esc(X('n8n answered. Live mode is on.', 'استجاب n8n، وتم تفعيل الوضع المباشر.'))}</div>`;
  } catch (e) { st.innerHTML = `<div class="notice error">${esc(X('No answer from n8n. Check the URL, that the workflow is published, and CORS. Outbound calls do not work inside Claude.', 'لم يستجب n8n. تحقق من الرابط ونشر المسار وإعداد CORS، علمًا بأن الاتصالات الخارجية لا تعمل داخل Claude.'))} <span class="mono">(${esc(e.message || e)})</span></div>`; }
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const t = e.target;
  const sc = t.closest('[data-scroll]'); if (sc) { const el = sc.dataset.scroll === 'top' ? document.body : document.getElementById(sc.dataset.scroll); if (el) { const y = sc.dataset.scroll === 'top' ? 0 : el.getBoundingClientRect().top + window.scrollY - 70; window.scrollTo({ top: y, behavior: 'smooth' }); } return; }
  const tb = t.closest('[data-tab]'); if (tb) { ui.tab = tb.dataset.tab; ui.confirming = null; render(); return; }
  const dc = t.closest('[data-decide]'); if (dc) { ui.confirming = { key: dc.dataset.key, decision: dc.dataset.decide }; render(); return; }
  const cf = t.closest('[data-confirm]'); if (cf && ui.confirming) { const k = cf.dataset.confirm; const n = (document.getElementById('note-' + k.replace('|', '-')) || {}).value || ''; decide(k, ui.confirming.decision, n.trim()); return; }
  const g = t.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
  const sv = t.closest('[data-sevf]'); if (sv) { const s = sv.dataset.sevf; ui.sevF = ui.sevF.includes(s) ? ui.sevF.filter(x => x !== s) : ui.sevF.concat(s); render(); return; }
  const ac = t.closest('[data-actor]'); if (ac) { ui.actor = ac.dataset.actor; render(); return; }
  const pr = t.closest('[data-period]'); if (pr) { ui.period = +pr.dataset.period; render(); return; }
  const sm = t.closest('[data-sample]'); if (sm) { const s = SAMPLES[+sm.dataset.sample]; const ta = $('#alertInput'); ta.value = L(s.t); ui.draftDet = s.d; $('#detSel').value = s.d; try { sessionStorage.setItem('aisoc.draft', ta.value); } catch (er) {} ta.focus(); return; }
  if (t.closest('#analyzeBtn')) { analyze(); return; }
  const cp = t.closest('[data-copy]'); if (cp) { copyText(document.getElementById('code-' + cp.dataset.copy).textContent); return; }
  const a = t.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'lang') { state.lang = state.lang === 'ar' ? 'en' : 'ar'; persist(); render(); }
  else if (act === 'cancel') { ui.confirming = null; render(); }
  else if (act === 'clearQ') { ui.q = ''; const s = $('#globalSearch'); if (s) s.value = ''; render(); }
  else if (act === 'clearEx') { state.incidents = state.incidents.filter(i => !i.example); persist(); if (route === 'incident' && !findInc(incRoute)) go('incidents'); else render(); toast(X('Example data removed.', 'تم حذف البيانات التجريبية.')); }
  else if (act === 'addNote') { const inp = $('#noteInput'); const v = (inp.value || '').trim(); if (!v) { inp.focus(); return; } const inc = findInc(incRoute); inc.notes.push({ at: new Date().toISOString(), text: v }); persist(); render(); }
  else if (act === 'copyRaw') copyText(findInc(incRoute).input);
  else if (act === 'saveConn') { state.triageUrl = ($('#triageUrl').value || '').trim(); state.decisionUrl = ($('#decisionUrl').value || '').trim(); persist(); render(); toast(X('Saved.', 'تم الحفظ.')); }
  else if (act === 'clearConn') { state.triageUrl = ''; state.decisionUrl = ''; persist(); render(); toast(X('Disconnected. The platform is back in demo mode.', 'تم قطع الاتصال، وعادت المنصة إلى الوضع التجريبي.')); }
  else if (act === 'testConn') testConnection();
  else if (act === 'copySummary') copyText(summaryText(reportStats(periodIncs())).join('\n\n'));
  else if (act === 'copyCsv') copyText([['id', 'created_at', 'severity', 'status', 'type', 'source', 'summary'].join(','), ...periodIncs().map(i => [i.id, i.createdAt, i.report.severity, statusOf(i), L(i.report.type), L(DET[i.detector] || DET.console), titleOf(i)].map(csvCell).join(','))].join('\n'));
  else if (act === 'copyAudit') copyText([['time', 'actor', 'incident', 'event'].join(','), ...allEvents().map(e => [e.at, e.actor, e.inc.id, e.text].map(csvCell).join(','))].join('\n'));
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'stF') { ui.stF = e.target.value; render(); }
  else if (id === 'detF') { ui.detF = e.target.value; render(); }
  else if (id === 'sortF') { ui.sort = e.target.value; render(); }
  else if (id === 'detSel') ui.draftDet = e.target.value;
  else if (id === 'statusSel') { const inc = findInc(incRoute); inc.status = e.target.value; inc.history.push({ at: new Date().toISOString(), to: e.target.value }); persist(); render(); toast(X('Status updated.', 'تم تحديث الحالة.')); }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'alertInput') { try { sessionStorage.setItem('aisoc.draft', e.target.value); } catch (er) {} }
  else if (id === 'globalSearch') { teardown3D(); ui.q = e.target.value; if (route !== 'incidents') { route = 'incidents'; incRoute = null; try { history.replaceState(null, '', '#incidents'); } catch (er) {} } chrome(); $('#content').innerHTML = (state.incidents.some(i => i.example) ? demoStrip() : '') + `<div class="view">${vIncidents()}</div>`; }
  else if (id === 'auditQ') { ui.auditQ = e.target.value; const pos = e.target.selectionStart; render(); const n = $('#auditQ'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) {} } }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') { const tr = e.target.closest && e.target.closest('tr[data-go]'); if (tr) { go(tr.dataset.go); return; } if (e.target.id === 'noteInput') { e.preventDefault(); a: { const v = e.target.value.trim(); if (!v) break a; findInc(incRoute).notes.push({ at: new Date().toISOString(), text: v }); persist(); render(); } } }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && e.target.id === 'alertInput') analyze();
});
window.addEventListener('hashchange', () => { parseHash(); render(); });

function tick() { const c = $('#clock'); if (c) try { c.textContent = new Date().toLocaleTimeString('en-GB', { timeZone: 'Asia/Riyadh', hour: '2-digit', minute: '2-digit' }); } catch (e) {} }
setInterval(tick, 15000);
parseHash(); render();
})();
</script>
